<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sun-cards dev harness</title>
<style>
  body { margin:0; background:#131318; padding:36px; display:flex; flex-direction:column; gap:28px; font-family:monospace; }
  h2 { color:#8b8d96; font:12px monospace; margin:0; letter-spacing:0.1em; text-transform:uppercase; }
  .row { display:flex; gap:20px; align-items:stretch; flex-wrap:wrap; }
  /* fixed height + min-height:0 mirrors how HA's sections grid sizes cards */
  .col { width:340px; height:376px; display:flex; flex-direction:column; gap:8px; }
  .col > :last-child { flex:1; min-height:0; }
  /* the wide card takes the whole row and sizes to its content, mirroring the
     `rows: auto` it asks HA for; .phone shows its stacked narrow layout */
  .col.wide { width:100%; max-width:1080px; height:auto; }
  .col.wide > :last-child { flex:none; }
  .col.phone { width:360px; height:auto; }
  .col.phone > :last-child { flex:none; }
  /* approximates HA's sections-layout heading card */
  .hdg { font:500 16px/1.3 system-ui,-apple-system,sans-serif; color:var(--primary-text-color,#e1e1e1); padding:0 4px; }
  /* HA default dark theme */
  #dark {
    --ha-card-background: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --disabled-text-color: #6f6f6f;
    --divider-color: rgba(225,225,225,0.12);
    --ha-card-border-radius: 12px;
  }
  /* HA default light theme (row sits on its own light backdrop) */
  #light-wrap { background:#f2f4f7; padding:24px; border-radius:14px; }
  #light {
    --ha-card-background: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --disabled-text-color: #bdbdbd;
    --divider-color: rgba(0,0,0,0.12);
    --ha-card-border-radius: 12px;
  }
</style>
<script>
// stage the clock with ?t=HHMM (e.g. ?t=1730) — must run before sun-cards.js loads
(() => {
  const m = /[?&]t=(\d{2})(\d{2})/.exec(location.search);
  if (!m) return;
  const R = Date;
  const target = new R();
  target.setHours(+m[1], +m[2], 0, 0);
  const delta = target.getTime() - R.now();
  window.Date = class extends R {
    constructor(...a) { a.length ? super(...a) : super(R.now() + delta); }
    static now() { return R.now() + delta; }
  };
})();
</script>
<script src="../sun-cards.js"></script>
<script>
// minimal ha-card shim: apply theme surface when the card doesn't self-style
customElements.define('ha-card', class extends HTMLElement {
  connectedCallback() {
    if (!(this.getAttribute('style') || '').includes('background')) {
      this.style.background = 'var(--ha-card-background, transparent)';
      this.style.borderRadius = 'var(--ha-card-border-radius, 12px)';
      this.style.border = '1px solid var(--divider-color, transparent)';
    }
  }
});
</script>
</head>
<body>
<h2>HA default dark theme</h2>
<div class="row" id="dark"></div>
<h2>HA default light theme</h2>
<div id="light-wrap"><div class="row" id="light"></div></div>
<script>
const LAT = 43.0804, LON = -88.3415;
const M = window.__SUN_CARDS__;
const iso = (d) => d ? d.toISOString() : undefined;

const now = new Date();
const tb = M.buildDayTable(LAT, LON, now);
const p = M.solarPos(now, LAT, LON);
const nr = tb.rise && tb.rise > now ? tb.rise : new Date(tb.rise.getTime() + 864e5);
const ns = tb.set && tb.set > now ? tb.set : new Date(tb.set.getTime() + 864e5);

const mkHass = (wx, darkMode = true) => ({
  config: { latitude: LAT, longitude: LON, time_zone: 'America/Chicago' },
  locale: { language: 'en', time_format: 'am_pm' },
  themes: { darkMode },
  states: {
    'sun.sun': {
      state: p.el > 0 ? 'above_horizon' : 'below_horizon',
      attributes: { azimuth: p.az, elevation: p.el, next_rising: iso(nr), next_setting: iso(ns) },
    },
    'weather.kues': { state: wx, attributes: {} },
    'input_boolean.shades_ignore_weather': { state: 'off', attributes: {} },
    'cover.deck_door': { state: 'open', attributes: {} },
    'cover.dining_room_somfyrts_living_room_shade': { state: 'open', attributes: {} },
  },
});

const WALLS = [
  { name: 'NW wall', bearing: 325, entity: 'cover.dining_room_somfyrts_living_room_shade' },
  { name: 'SW wall', bearing: 236, entity: 'cover.deck_door' },
];

function addCards(rowId, hass, extraCfg = {}) {
  const SUN_CFG = { heading: 325, walls: WALLS, sun_window: 78, min_elevation: 3 };
  const GATE_CFG = { weather_entity: 'weather.kues', bypass_entity: 'input_boolean.shades_ignore_weather' };
  const cfgs = [
    ['sun-cards-bearing', 'Sun & windows', { ...SUN_CFG, ...GATE_CFG }],
    ['sun-cards-elevation', 'Elevation', {}],
    ['sun-cards-path', "Today's path", SUN_CFG],
    ['sun-cards-wide', 'Sun (wide)', { ...SUN_CFG, ...GATE_CFG }, 'wide'],
    ['sun-cards-wide', 'Sun (wide, phone width)', { ...SUN_CFG, ...GATE_CFG }, 'phone'],
  ];
  for (const [tag, heading, cfg, cls] of cfgs) {
    const card = document.createElement(tag);
    card.setConfig({ ...cfg, ...extraCfg });
    card.hass = hass;
    const wrap = document.createElement('div');
    wrap.className = cls ? `col ${cls}` : 'col';
    const h = document.createElement('div');
    h.className = 'hdg';
    h.textContent = heading;
    wrap.appendChild(h);
    wrap.appendChild(card);
    document.getElementById(rowId).appendChild(wrap);
  }
}

addCards('dark', mkHass('sunny', true));
addCards('light', mkHass('sunny', false));

console.log('STATE', { az: p.az.toFixed(1), el: p.el.toFixed(1),
  rise: tb.rise?.toLocaleTimeString(), set: tb.set?.toLocaleTimeString() });

// &row=dark / &row=light — show a single row (used for README screenshots)
const only = (/[?&]row=(\w+)/.exec(location.search) || [])[1];
if (only) {
  document.querySelectorAll('h2').forEach((h) => h.remove());
  const drop = only === 'dark' ? 'light-wrap' : 'dark';
  document.getElementById(drop).remove();
  if (only === 'light') document.body.style.background = '#f2f4f7';
  document.getElementById('light-wrap')?.style.setProperty('padding', '0');
}

// &show=phone — just the wide card at phone width; &show=cards — everything but
// that column. The phone column is a dev aid, so README shots pick one or the
// other rather than showing the wide card twice in the same image.
const show = (/[?&]show=(\w+)/.exec(location.search) || [])[1];
if (show === 'phone') {
  document.querySelectorAll('.col:not(.phone)').forEach((e) => e.remove());
  document.querySelectorAll('.hdg').forEach((e) => e.remove());
} else if (show === 'cards') {
  document.querySelectorAll('.col.phone').forEach((e) => e.remove());
}
</script>
</body>
</html>
